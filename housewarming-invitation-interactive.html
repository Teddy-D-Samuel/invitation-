<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b0a17">
<title>Housewarming Pooja Invitation</title>
<style>
:root{--bg:#3b0a17;--bg2:#5a1424;--gold:#f6b13c;--flame:#ffd36b;--ivory:#fff1d6;--orange:#ff8a1f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{background:radial-gradient(120% 90% at 50% 35%,var(--bg2),var(--bg) 70%) fixed;color:var(--ivory);
font-family:Georgia,"Palatino Linotype",Palatino,"Times New Roman",serif;overflow-x:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;
padding:calc(46px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));position:relative}
.inner{margin:auto 0;display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px;position:relative;z-index:1}
.garland{position:fixed;top:0;left:0;right:0;height:34px;z-index:3;opacity:0;transform:translateY(-44px);
background:radial-gradient(circle at 17px 17px,var(--orange) 0 9px,var(--gold) 10px 14px,transparent 15px) 0 0/34px 34px repeat-x;
padding-top:env(safe-area-inset-top,0px)}
.garland::after{content:"";position:absolute;left:0;right:0;top:30px;height:26px;transform-origin:top center;
background:radial-gradient(circle at 17px 5px,var(--gold) 0 4px,transparent 5px) 0 0/34px 26px repeat-x,
linear-gradient(90deg,transparent 16px,rgba(246,177,60,.7) 16px 17px,transparent 17px) 0 0/34px 20px repeat-x}
.glow{position:fixed;top:36%;left:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;z-index:0;pointer-events:none;
background:radial-gradient(circle,rgba(255,190,80,.30) 0,rgba(255,150,40,.10) 18%,transparent 40%);opacity:0;transform:scale(.1)}
.diya{width:110px;height:110px;background:none;border:0;cursor:pointer;padding:0;position:relative;transition:transform .6s,width .6s,height .6s,filter .6s;filter:brightness(.55)}
.diya:focus-visible,.btn:focus-visible{outline:3px solid var(--ivory);outline-offset:4px;border-radius:12px}
.diya svg{width:100%;height:100%;display:block;overflow:visible}
.flame{transform-origin:46px 44px;transform:scale(0)}
.hint{margin-top:14px;font-style:italic;font-size:17px;color:var(--flame);animation:pulse 1.6s ease-in-out infinite;transition:opacity .4s}
.lit .hint{opacity:0;animation:none;position:absolute;pointer-events:none}
.lit .diya{width:84px;height:84px;filter:none}
.rest>*{opacity:0}
.om{font-size:30px;color:var(--gold);margin-top:6px}
.small{font-size:17px;font-style:italic;margin-top:10px}
h1{font-size:clamp(34px,11vw,48px);line-height:1.08;color:var(--flame);margin-top:8px}
.line{width:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;opacity:1!important}
.when{font-size:20px;line-height:1.5}
.when b{display:block;font-size:25px;color:var(--gold)}
.count{display:flex;gap:8px;margin-top:16px}
.count div{min-width:62px;padding:8px 4px 6px;border:1px solid rgba(246,177,60,.45);border-radius:14px;background:rgba(0,0,0,.18)}
.count strong{display:block;font-size:24px;color:var(--flame);font-variant-numeric:tabular-nums}
.count span{font-size:12px;opacity:.8}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:999px;border:1.5px solid var(--gold);background:none;
color:var(--ivory);font:700 16px Georgia,serif;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.main{grid-column:1/3;background:var(--gold);color:var(--bg)}
.note{font-size:15px;font-style:italic;margin-top:16px;max-width:290px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ivory);color:var(--bg);
padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.3s;z-index:5;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Sequence: roughly 5 seconds after the tap */
.lit .garland{animation:drop .9s ease-out .15s forwards}
.lit .garland::after{animation:sway 3s ease-in-out 1.2s infinite alternate}
.lit .glow{animation:glow 1.6s ease-out .2s forwards,breathe 3.2s ease-in-out 1.8s infinite alternate}
.lit .flame{animation:ignite .7s cubic-bezier(.2,1.4,.4,1) 0s forwards,flick .45s ease-in-out .7s infinite alternate}
.lit .om{animation:rise .6s ease-out .8s forwards}
.lit .small{animation:rise .6s ease-out 1.2s forwards}
.lit h1{animation:pop .8s cubic-bezier(.2,1.3,.4,1) 1.6s forwards}
.lit .line{animation:grow .7s ease-out 2.4s forwards}
.lit .when{animation:rise .7s ease-out 2.7s forwards}
.lit .count{animation:rise .7s ease-out 3.4s forwards}
.lit .acts{animation:rise .7s ease-out 4.0s forwards}
.lit .note{animation:rise .7s ease-out 4.5s forwards}
@keyframes pulse{50%{opacity:.45;transform:scale(.97)}}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@keyframes glow{to{opacity:1;transform:scale(1)}}
@keyframes breathe{from{opacity:1}to{opacity:.7}}
@keyframes ignite{to{transform:scale(1)}}
@keyframes flick{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.07,1.13) rotate(2deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes grow{to{width:min(260px,70vw)}}
@media (prefers-reduced-motion:reduce){
.lit .garland,.lit .glow,.lit .rest>*{animation:none!important;opacity:1!important;transform:none!important}
.lit .flame{animation:none!important;transform:none}.lit .line{animation:none!important;width:min(260px,70vw)}.lit .garland::after{animation:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="garland" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<main class="stage" id="stage">
  <div class="inner">
    <button class="diya" id="diya" type="button" aria-label="Light the diya to open the invitation">
      <svg viewBox="0 0 92 92" aria-hidden="true">
        <g class="flame"><path d="M46 12c8 12 12 18 12 27a12 12 0 0 1-24 0c0-6 3-10 7-15 1 4 3 6 5 7-2-7-1-13 0-19z" fill="#ffb02e"/>
        <path d="M46 28c4 6 6 9 6 13a6 6 0 0 1-12 0c0-3 2-6 6-13z" fill="#fff3b0"/></g>
        <path d="M12 56h68c0 14-12 24-34 24S12 70 12 56z" fill="#c8721a"/>
        <path d="M12 56h68" stroke="#f6b13c" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
    <p class="hint">Tap the diya to light it</p>
    <div class="rest" style="display:contents">
      <div class="om" aria-hidden="true">ॐ</div>
      <p class="small">With joy, we invite you to our</p>
      <h1>Housewarming Pooja</h1>
      <div class="line" aria-hidden="true"></div>
      <div class="when"><b>Saturday, 28 November</b>Pooja at 2:00 PM<br>Lunch to follow</div>
      <div class="count" id="count" aria-live="off"><div><strong id="d">0</strong><span>days</span></div><div><strong id="h">0</strong><span>hours</span></div><div><strong id="m">0</strong><span>min</span></div><div><strong id="s">0</strong><span>sec</span></div></div>
      <div class="acts">
        <a class="btn main" id="map" href="https://maps.app.goo.gl/4PBnNMPVcsG2yAQx6?g_st=ac" target="_blank" rel="noopener">Open location in Maps</a>
        <a class="btn" id="cal" href="#" target="_blank" rel="noopener">Add to calendar</a>
        <button class="btn" id="share" type="button">Share</button>
      </div>
      <p class="note">Your presence and blessings will make the day special. Tap anywhere for a shower of petals.</p>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var stage=document.getElementById('stage'),cv=document.getElementById('fx'),ctx=cv.getContext('2d'),
reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,lit=false,W,H,petals=[];
var MAP='https://maps.app.goo.gl/4PBnNMPVcsG2yAQx6?g_st=ac';
var TXT='You\u2019re invited to our Housewarming Pooja followed by lunch.\nSaturday, 28 November, 2:00 PM.\nLocation: '+MAP;
document.getElementById('cal').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Housewarming Pooja and Lunch')+
'&dates=20261128T140000/20261128T170000&details='+encodeURIComponent('Pooja at 2:00 PM, lunch to follow.')+'&location='+encodeURIComponent(MAP);

function resize(){var r=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0)}
resize();addEventListener('resize',resize);

function add(x,y,vx,vy,b){petals.push({x:x,y:y,vx:vx,vy:vy,r:Math.random()*6.28,vr:(Math.random()-.5)*.1,s:4+Math.random()*5,
c:Math.random()<.55?'#ff8a1f':'#f6b13c',a:1,b:b,t:Math.random()*6.28})}
function burst(x,y,n){if(reduce)return;for(var i=0;i<n;i++){var an=Math.random()*6.28,sp=2+Math.random()*5;add(x,y,Math.cos(an)*sp,Math.sin(an)*sp-3,true)}}
function frame(){
  ctx.clearRect(0,0,W,H);
  if(lit&&!reduce&&petals.length<42&&Math.random()<.12)add(Math.random()*W,-12,0,.8+Math.random()*1.2,false);
  for(var i=petals.length-1;i>=0;i--){var p=petals[i];
    if(p.b){p.vx*=.97;p.vy=p.vy*.97+.14;p.a-=.012}else{p.t+=.03;p.vx=Math.sin(p.t)*.7}
    p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    if(p.a<=0||p.y>H+20){petals.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=Math.max(p.a,0);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.5,0,0,6.28);ctx.fill();ctx.restore()}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

var diya=document.getElementById('diya');
function light(){
  if(lit)return;lit=true;stage.classList.add('lit');diya.setAttribute('aria-label','Diya lit');
  if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
  var r=diya.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,28);tick();setInterval(tick,1000)}
diya.addEventListener('click',function(){light()});

addEventListener('pointerdown',function(e){
  if(!lit||e.target.closest('a,button'))return;burst(e.clientX,e.clientY,16);
  if(navigator.vibrate)try{navigator.vibrate(10)}catch(x){}});

var target=new Date(2026,10,28,14,0,0).getTime();
function tick(){var d=Math.max(0,target-Date.now()),s=Math.floor(d/1000);
  document.getElementById('d').textContent=Math.floor(s/86400);
  document.getElementById('h').textContent=Math.floor(s%86400/3600);
  document.getElementById('m').textContent=Math.floor(s%3600/60);
  document.getElementById('s').textContent=s%60}

var toast=document.getElementById('toast'),tt;
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on')},2200)}
document.getElementById('share').addEventListener('click',function(){
  if(navigator.share){navigator.share({title:'Housewarming Pooja Invitation',text:TXT}).catch(function(){});return}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(TXT).then(function(){say('Invitation text copied')},function(){say('Could not copy')})}
  else say('Sharing is not supported here')});
})();
</script>
</body>
</html>
